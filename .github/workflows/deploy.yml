name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Rebuild data.js from ccf-deadlines
        run: uv run build_data.py

      - name: Commit refreshed data
        run: |
          if ! git diff --quiet -- data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh conference data" -- data.js
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Collect site files
        run: mkdir -p _site && cp index.html data.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
