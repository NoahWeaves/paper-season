<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Submission deadlines and conference dates for the CS conferences you follow, six months either side of today.">
<meta property="og:title" content="Paper Season">
<meta property="og:description" content="Submission deadlines and conference dates for the CS conferences you follow.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 29V4' stroke='%233442c4' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M8 5h18l-5 6 5 6H8z' fill='%233442c4'/%3E%3C/svg%3E">
<title>Paper Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a bare full-screen timeline. Month markers along the top, a vertical line for now, one quiet horizontal line per chosen conference, one round button that opens the picker. */
  /* Single light look: off-white paper, dark ink. */
  :root {
    --bg: #f6f5f1;
    --surface: #fdfcfa;
    --ink: #23272f;
    --muted: #6e717a;
    --line: #dcdad4;
    --soft: #ecebe6;
    --rule: #b3b0a8;
    --deadline: #3442c4;
    --published: #0d7f69;
    --decision: #a86c10;
    --rebuttal: #8a4c9e;
    --now: #c03a26;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); overflow: hidden; }
  a { color: var(--deadline); text-underline-offset: 2px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--deadline); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Timeline */
  .board { position: relative; height: 100%; overflow: hidden; }
  .axis { position: absolute; top: 0; left: 0; right: 0; height: 2.4rem; pointer-events: none; z-index: 3; }
  .tick { position: absolute; top: .8rem; transform: translateX(-50%); font-size: .85rem; color: var(--muted); white-space: nowrap; }
  .tick.year { color: var(--ink); font-weight: 600; }
  /* today: a hairline that spans only the conference lanes, with a small label on top */
  .now-line { position: absolute; top: 1.7rem; bottom: 5rem; left: 0; width: 1px; background: var(--now); opacity: .5; z-index: 1; pointer-events: none; }
  .now-line::before { content: "today"; position: absolute; bottom: 100%; left: 0; transform: translateX(-50%); margin-bottom: .2rem; font-size: .66rem; letter-spacing: .04em; color: var(--now); }
  /* month gridlines: one quiet solid line at the start of each month */
  .grid { position: absolute; top: 1.7rem; bottom: 5rem; left: 0; right: 0; pointer-events: none; z-index: 0; }
  .gl { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--rule); opacity: .7; }

  .lanes { position: absolute; top: 2.4rem; left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
  .lanes-inner { position: relative; padding-block: 1.7rem 5rem; }
  .lane { position: relative; height: 3.6rem; }
  .lane::before { content: ""; position: absolute; left: 0; right: 0; top: 60%; height: 1.5px; margin-top: -.75px; background: var(--rule); }
  .lane-name { position: absolute; left: 16px; top: .35rem; z-index: 4; font-size: .8rem; font-weight: 600; color: var(--ink); background: var(--bg); padding: 0 .4rem 0 0; border: 0; cursor: pointer; }
  .lane-name:hover { text-decoration: underline; text-underline-offset: 3px; }

  .m { position: absolute; left: 0; top: 60%; z-index: 2; will-change: transform; }
  .span { height: 3px; margin-top: -1.5px; background: var(--muted); opacity: .18; border-radius: 2px; z-index: 1; }
  .mk { width: 0; height: 0; cursor: pointer; }
  .mk::after { content: ""; position: absolute; width: 1.4rem; height: 1.4rem; transform: translate(-50%, -50%); }
  .mk svg { position: absolute; overflow: visible; transition: scale .12s; }
  .mk:hover svg { scale: 1.2; }
  /* deadline: a paper scroll sitting on the date (solid = full paper, outline = abstract) */
  .doc svg { width: 20px; height: 20px; left: -10px; top: -10px; color: var(--deadline); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .doc .body { fill: currentColor; }
  .doc .text { stroke: var(--bg); }
  .doc.abs .body { fill: var(--bg); }
  .doc.abs .text { stroke: currentColor; }
  .doc.est svg { opacity: .45; }
  .doc.est .body { fill: var(--bg); }
  .doc.est .text { stroke: currentColor; }
  /* conference: a speaker behind a podium, centred on the first day */
  .podium svg { width: 22px; height: 22px; left: -11px; top: -14px; color: var(--published); fill: currentColor; }
  .podium .stand { stroke: var(--bg); stroke-width: 1.6; stroke-linejoin: round; paint-order: stroke; }
  .podium.est svg { opacity: .45; }
  /* rebuttal: a speech bubble (answering the reviewers) */
  .reb svg { width: 17px; height: 17px; left: -8.5px; top: -9.5px; color: var(--rebuttal); fill: currentColor; }
  .reb.est svg { opacity: .45; }
  /* decisions: an exclamation mark */
  .dec svg { width: 16px; height: 16px; left: -8px; top: -9px; color: var(--decision); fill: currentColor; }
  .dec.est svg { opacity: .45; }

  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; }

  .dock { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: .6rem .9rem; max-width: calc(100vw - 40px); }
  .fab { border: 0; border-radius: 999px; padding: .65rem 1.2rem; background: var(--ink); color: var(--bg); font-size: .88rem; font-weight: 500; cursor: pointer; box-shadow: 0 6px 20px rgba(10, 15, 25, .18); }
  /* key: one row of the timeline's symbols */
  .key { display: flex; flex-wrap: wrap; gap: .3rem .9rem; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: .45rem .9rem; font-size: .72rem; color: var(--muted); }
  .key .k { display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap; }
  .key .ki { position: relative; display: inline-block; width: 15px; height: 15px; }
  .key .ki svg { position: static; display: block; width: 15px; height: 15px; }
  .fab:hover { transform: translateY(-1px); }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .45rem .9rem; cursor: pointer; font-size: .88rem; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 500; }

  /* Detail card */
  .card { position: fixed; z-index: 40; width: max-content; max-width: min(19rem, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(10, 15, 25, .16); padding: .7rem .9rem; display: flex; flex-direction: column; gap: .15rem; font-size: .84rem; cursor: default; user-select: text; }
  .card .ev-head { font-size: .74rem; color: var(--muted); font-weight: 600; padding-right: 1.2rem; }
  .card h2 { margin: 0; padding-right: 1.2rem; font: 600 1.05rem/1.25 var(--font-display); }
  .card .ev-when { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .82rem; margin-top: .2rem; }
  .card .ev-sub { color: var(--muted); font-size: .76rem; }
  .card .full { color: var(--muted); font-size: .78rem; margin-bottom: .35rem; }
  .card .rows { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .35rem .8rem; margin: .2rem 0 0; }
  .card .rows dt { color: var(--muted); font-size: .74rem; padding-top: .1rem; }
  .card .rows dd { margin: 0; font-size: .8rem; }
  .card .rows dd .ev-sub { display: block; }
  .card .actions { display: flex; gap: .8rem; align-items: center; margin-top: .65rem; flex-wrap: wrap; }
  .card .go { display: inline-flex; align-items: center; gap: .35rem; background: var(--ink); color: var(--bg); text-decoration: none; border-radius: 7px; padding: .38rem .75rem; font-size: .8rem; font-weight: 500; }
  .card .go:hover { opacity: .88; }
  .card .alt { font-size: .78rem; color: var(--muted); }
  .card .close { position: absolute; top: .4rem; right: .45rem; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: .9rem; display: none; }
  .card.pinned .close { display: block; }
  .badge { font: 600 .62rem/1 var(--font-mono); padding: .2rem .35rem; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.est { border-style: dashed; }
  .soon { color: var(--now); font-weight: 600; }

  /* Picker */
  dialog { border: 0; border-radius: 14px; padding: 0; width: min(36rem, calc(100vw - 24px)); height: min(40rem, calc(100vh - 32px)); max-height: none; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(10, 15, 25, .3); }
  dialog::backdrop { background: rgba(10, 14, 22, .4); }
  dialog[open] { display: flex; flex-direction: column; }
  .dlg-head { padding: 1.3rem 1.3rem .8rem; display: flex; flex-direction: column; gap: .8rem; }
  .dlg-head h2 { margin: 0; font: 600 1.3rem/1.2 var(--font-display); text-wrap: balance; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: .22rem .75rem; cursor: pointer; font-size: .84rem; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.partial { border-color: var(--ink); border-style: dashed; }
  #q { font: inherit; padding: .5rem .75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
  .results { list-style: none; margin: 0; padding: 0 .6rem; overflow-y: auto; flex: 1; min-height: 0; }
  .results label { display: grid; grid-template-columns: auto 8.5rem minmax(0, 1fr); gap: .7rem; align-items: center; padding: .45rem .7rem; cursor: pointer; font-size: .88rem; border-radius: 8px; }
  .results label:hover { background: var(--soft); }
  .results input { accent-color: var(--ink); }
  .results .desc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .none { padding: 1.5rem; text-align: center; color: var(--muted); }
  .dlg-foot { display: flex; align-items: center; gap: .8rem; padding: .9rem 1.3rem 1.1rem; border-top: 1px solid var(--soft); }
  .dlg-foot .note { font-size: .74rem; color: var(--muted); flex: 1; min-width: 0; }
</style>
</head>
<body>

<div class="board" id="board" aria-label="Conference timeline, six months either side of today">
  <div class="axis" id="axis"></div>
  <div class="now-line" id="now-line"></div>
  <div class="grid" id="grid"></div>
  <div class="lanes" id="lanes"><div class="lanes-inner" id="lanes-inner"></div></div>
</div>

<div class="dock">
  <div class="key" aria-label="Key"><span class="k"><span class="ki doc"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M8 4h11a2 2 0 0 1 0 4h-1v10a2 2 0 0 1-2 2H6a2 2 0 0 1 0-4h1V6a2 2 0 0 1 2-2z"/><path d="M7 16v2a2 2 0 0 1-2 2"/><path class="text" d="M11 9h4M11 12.5h4"/></svg></span>Submission</span><span class="k"><span class="ki doc abs"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M8 4h11a2 2 0 0 1 0 4h-1v10a2 2 0 0 1-2 2H6a2 2 0 0 1 0-4h1V6a2 2 0 0 1 2-2z"/><path d="M7 16v2a2 2 0 0 1-2 2"/><path class="text" d="M11 9h4M11 12.5h4"/></svg></span>Abstract</span><span class="k"><span class="ki reb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></span>Rebuttal</span><span class="k"><span class="ki dec"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9.6" y="2.5" width="4.8" height="13" rx="2.4"/><circle cx="12" cy="20" r="2.5"/></svg></span>Decisions</span><span class="k"><span class="ki podium"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.2" r="3"/><path d="M5.5 14.5a6.5 6 0 0 1 13 0z"/><path class="stand" d="M4.3 11h15.4l-2.2 10.5H6.5z"/></svg></span>Conference</span><span class="k"><span class="ki doc est"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M8 4h11a2 2 0 0 1 0 4h-1v10a2 2 0 0 1-2 2H6a2 2 0 0 1 0-4h1V6a2 2 0 0 1 2-2z"/><path d="M7 16v2a2 2 0 0 1-2 2"/><path class="text" d="M11 9h4M11 12.5h4"/></svg></span>Estimated</span></div>
  <button class="fab" id="pick-btn" type="button">Conferences</button>
</div>

<div class="card" id="card" hidden></div>

<dialog id="picker" aria-labelledby="picker-title">
  <div class="dlg-head">
    <h2 id="picker-title">Which conferences do you follow?</h2>
    <div class="chips" id="tracks" aria-label="Fields"></div>
    <input id="q" type="search" autofocus autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search" aria-label="Search conferences" autocomplete="off">
  </div>
  <ul class="results" id="results"></ul>
  <div class="dlg-foot">
    <span class="note">Showing six months either side of today. Dates from <a href="https://github.com/ccfddl/ccf-deadlines" target="_blank" rel="noopener">ccf-deadlines</a>.</span>
    <button class="btn primary" id="done-btn" type="button">Done</button>
  </div>
</dialog>

<script src="data.js"></script>
<script>
(() => {
  const D = window.CONF_DATA;
  const DAY = 864e5;
  const byId = new Map(D.conferences.map(c => [c.id, c]));
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const $ = id => document.getElementById(id);

  const TRACKS = [
    { id: "nlp", name: "NLP", ids: ["acl","emnlp","naacl","eacl","coling","colm","conll","ijcnlp"] },
    { id: "ml", name: "Machine learning", ids: ["nips","icml","iclr","aistats","colt","uai"] },
    { id: "cv", name: "Vision", ids: ["cvpr","iccv","eccv","wacv","bmvc"] },
    { id: "ai", name: "General AI", ids: ["aaai","ijcai","ecai"] },
    { id: "data", name: "Data & web", ids: ["sigkdd","www","sigir","wsdm"] },
    { id: "speech", name: "Speech", ids: ["icassp","interspeech"] },
    { id: "robot", name: "Robotics", ids: ["icra","iros","rss","corl"] },
    { id: "hci", name: "HCI", ids: ["chi","uist"] },
  ].map(t => ({ ...t, ids: t.ids.filter(id => byId.has(id)) }));

  // ---------- persisted state ----------
  const STORE_KEY = "paperSeason.v3";
  let selected = [], firstVisit = true;
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && Array.isArray(saved.selected)) { selected = saved.selected.filter(id => byId.has(id)); firstVisit = false; }
  } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ selected })); } catch (e) {} };

  // ---------- time helpers ----------
  function tzOffset(tz) {
    const s = (tz || "AoE").trim().toUpperCase();
    if (s === "AOE") return -12;
    if (s === "PT" || s === "PDT") return -7;
    if (s === "PST") return -8;
    if (s === "UTC" || s === "GMT") return 0;
    const m = s.match(/^(?:UTC|GMT)\s*([+-])\s*(\d{1,2})(?::?(\d\d))?$/);
    return m ? (m[1] === "-" ? -1 : 1) * (+m[2] + (m[3] ? +m[3] / 60 : 0)) : 0;
  }
  function parseDeadline(str, off) {
    if (!str) return null;
    const m = String(str).match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (!m) return null;
    const [, y, mo, d, h = "23", mi = "59", se = "59"] = m;
    return Date.UTC(+y, +mo - 1, +d, +h, +mi, +se) - off * 36e5;
  }
  const parseDay = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const addYears = (t, n) => { if (t == null) return null; const d = new Date(t); d.setUTCFullYear(d.getUTCFullYear() + n); return d.getTime(); };
  const pad = n => String(n).padStart(2, "0");
  const zoneName = off => off === -12 ? "AoE" : off === 0 ? "UTC" : `UTC${off > 0 ? "+" : "−"}${Math.abs(off)}`;
  function fmtZone(t, off) {
    const d = new Date(t + off * 36e5);
    return `${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}, ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} ${zoneName(off)}`;
  }
  const fmtShort = (t, off = -12) => { const d = new Date(t + off * 36e5); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
  const fmtLocal = t => new Date(t).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  function fmtRange(s, e) {
    const a = new Date(s), b = new Date(e ?? s);
    const [am, ad, ay, bm, bd, by] = [a.getUTCMonth(), a.getUTCDate(), a.getUTCFullYear(), b.getUTCMonth(), b.getUTCDate(), b.getUTCFullYear()];
    if (e == null || s === e) return `${MON[am]} ${ad}, ${ay}`;
    if (ay !== by) return `${MON[am]} ${ad}, ${ay} – ${MON[bm]} ${bd}, ${by}`;
    if (am === bm) return `${MON[am]} ${ad}–${bd}, ${ay}`;
    return `${MON[am]} ${ad} – ${MON[bm]} ${bd}, ${ay}`;
  }
  function span(ms) {
    const abs = Math.abs(ms);
    const d = Math.floor(abs / DAY), h = Math.floor(abs % DAY / 36e5), m = Math.floor(abs % 36e5 / 6e4);
    return d >= 1 ? `${d} day${d === 1 ? "" : "s"}${d < 7 ? `, ${h} h` : ""}` : `${h} h ${m} min`;
  }
  const relTime = (t, now = Date.now()) => t >= now ? `in ${span(t - now)}` : `${span(t - now)} ago`;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- data model ----------
  const edCache = new Map();
  function editions(c) {
    if (edCache.has(c.id)) return edCache.get(c.id);
    const eds = c.editions.map(e => {
      const off = tzOffset(e.tz);
      const items = (e.deadlines || []).map(dl => ({
        abstract: parseDeadline(dl.abstract_deadline, off),
        paper: parseDeadline(dl.deadline, off),
        rebuttal: parseDeadline(dl.rebuttal_deadline, off),
        decision: parseDeadline(dl.decision_deadline, off),
        comment: dl.comment || "",
        est: false,
      })).filter(i => (i.abstract ?? i.paper ?? i.rebuttal ?? i.decision) != null);
      const start = parseDay(e.start);
      return {
        conf: c, year: e.year, link: e.link, place: e.place, dateText: e.dateText,
        start, end: e.end ? parseDay(e.end) : start, off, items, estConf: false,
      };
    });
    const shiftItem = (it, n) => ({
      abstract: addYears(it.abstract, n), paper: addYears(it.paper, n),
      rebuttal: addYears(it.rebuttal, n), decision: addYears(it.decision, n),
      comment: /\d{4}/.test(it.comment) ? "" : it.comment, est: true,
    });
    // Unknown dates are estimated from the most recent earlier edition that has them.
    eds.forEach((e, i) => {
      const earlier = eds.slice(0, i).reverse();
      if (!e.items.some(it => it.paper != null)) {
        const t = earlier.find(p => p.items.some(it => it.paper != null));
        if (t) { e.items = t.items.map(it => shiftItem(it, e.year - t.year)); e.basis = t.year; }
      }
      if (e.start == null) {
        const t = earlier.find(p => p.start != null);
        if (t) { e.start = addYears(t.start, e.year - t.year); e.end = addYears(t.end, e.year - t.year); e.estConf = true; e.basis ??= t.year; }
      }
    });
    const finish = e => {
      e.main = e.items.map(i => i.paper).filter(t => t != null).sort((a, b) => a - b)[0] ?? null;
      e.decision = e.items.map(i => i.decision).find(t => t != null) ?? null;
      return e;
    };
    eds.forEach(finish);
    // Project the next edition when the newest one has already closed submissions.
    const last = eds[eds.length - 1];
    if (last && last.main != null && last.main < Date.now()) {
      const prev = eds[eds.length - 2];
      let gap = prev ? last.year - prev.year : 1;
      if (gap < 1 || gap > 2) gap = 1;
      eds.push(finish({
        ...last, year: last.year + gap, link: null, place: null, dateText: null,
        start: addYears(last.start, gap), end: addYears(last.end, gap), estConf: last.start != null,
        items: last.items.map(it => shiftItem(it, gap)), basis: last.year,
      }));
    }
    edCache.set(c.id, eds);
    return eds;
  }
  function nextDeadline(c) {
    const now = Date.now();
    let best = null;
    for (const e of editions(c)) for (const i of e.items) {
      const t = i.paper ?? i.abstract;
      if (t != null && t >= now && (!best || t < best.t)) best = { t, e, est: i.est };
    }
    return best;
  }
  const RANK_SCORE = { "A*": 0, "A": 1, "B": 2, "C": 3 };
  function shortComment(c) {
    if (!c) return "";
    if (/commit/i.test(c)) return "ARR commitment";
    if (/ARR/i.test(c)) return "ARR submission";
    return c.length > 22 ? "Deadline" : c;
  }

  // ---------- viewport ----------
  // Fixed window: half a year either side of today, today in the middle.
  const RANGE_DAYS = 183;
  const board = $("board"), axis = $("axis"), lanesEl = $("lanes"), inner = $("lanes-inner"), nowLine = $("now-line"), gridEl = $("grid");
  let W = 800, t0 = 0, pxPerDay = 1, marks = [];

  const pxPerMs = () => pxPerDay / DAY;
  const x = t => (t - t0) * pxPerMs();
  function measure() {
    W = Math.max(200, lanesEl.clientWidth || board.clientWidth);
    pxPerDay = W / (2 * RANGE_DAYS);
    t0 = Date.now() - RANGE_DAYS * DAY;
  }

  // ---------- lanes ----------
  function buildLanes() {
    const confs = selected.map(id => byId.get(id))
      .sort((a, b) => (nextDeadline(a)?.t ?? Infinity) - (nextDeadline(b)?.t ?? Infinity) || a.title.localeCompare(b.title));
    marks = [];
    if (!confs.length) {
      inner.innerHTML = "";
      $("empty")?.remove();
      board.insertAdjacentHTML("beforeend", `<div class="empty" id="empty"><button class="btn primary" type="button" data-open-picker>Choose conferences</button></div>`);
      layout();
      return;
    }
    $("empty")?.remove();
    let html = "";
    for (const c of confs) {
      html += `<div class="lane"><button type="button" class="lane-name" data-info="${c.id}">${esc(c.title)}</button>`;
      editions(c).forEach((e, ei) => {
        const key = `${c.id}|${ei}`;
        if (e.main != null && e.start != null && e.start > e.main) html += `<div class="m span" data-a="${e.main}" data-b="${e.start}"></div>`;
        e.items.forEach((it, ii) => {
          const ref = `data-ed="${key}" data-item="${ii}"`, est = it.est ? " est" : "";
          if (it.abstract != null && it.abstract !== it.paper) html += `<div class="m mk doc abs${est}" data-a="${it.abstract}" ${ref} data-kind="abstract"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M8 4h11a2 2 0 0 1 0 4h-1v10a2 2 0 0 1-2 2H6a2 2 0 0 1 0-4h1V6a2 2 0 0 1 2-2z"/><path d="M7 16v2a2 2 0 0 1-2 2"/><path class="text" d="M11 9h4M11 12.5h4"/></svg></div>`;
          if (it.paper != null) html += `<div class="m mk doc${est}" data-a="${it.paper}" ${ref} data-kind="paper"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M8 4h11a2 2 0 0 1 0 4h-1v10a2 2 0 0 1-2 2H6a2 2 0 0 1 0-4h1V6a2 2 0 0 1 2-2z"/><path d="M7 16v2a2 2 0 0 1-2 2"/><path class="text" d="M11 9h4M11 12.5h4"/></svg></div>`;
          if (it.rebuttal != null) html += `<div class="m mk reb${est}" data-a="${it.rebuttal}" ${ref} data-kind="rebuttal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></div>`;
          if (it.decision != null) html += `<div class="m mk dec${est}" data-a="${it.decision}" ${ref} data-kind="decision"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9.6" y="2.5" width="4.8" height="13" rx="2.4"/><circle cx="12" cy="20" r="2.5"/></svg></div>`;
        });
        if (e.start != null) html += `<div class="m mk podium${e.estConf ? " est" : ""}" data-a="${e.start}" data-ed="${key}" data-kind="conf"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.2" r="3"/><path d="M5.5 14.5a6.5 6 0 0 1 13 0z"/><path class="stand" d="M4.3 11h15.4l-2.2 10.5H6.5z"/></svg></div>`;
      });
      html += `</div>`;
    }
    inner.innerHTML = html;
    inner.prepend(gridEl, nowLine);
    inner.querySelectorAll(".m").forEach(el => marks.push({ el, a: +el.dataset.a, b: el.dataset.b ? +el.dataset.b : null }));
    layout();
  }

  // ---------- per-frame layout ----------
  let frame = 0;
  function layout() { if (!frame) frame = requestAnimationFrame(() => { frame = 0; draw(); }); }
  function draw() {
    measure();
    const k = pxPerMs();
    for (const m of marks) {
      const a = (m.a - t0) * k;
      const b = m.b != null ? (m.b - t0) * k : a;
      if (b < -300 || a > W + 300) { m.el.hidden = true; continue; }
      m.el.hidden = false;
      m.el.style.transform = `translateX(${a}px)`;
      if (m.b != null) m.el.style.width = `${Math.max(b - a, 0)}px`;
    }
    drawAxis();
    const nx = x(Date.now());
    nowLine.hidden = nx < 0 || nx > W || !marks.length;
    nowLine.style.transform = `translateX(${nx}px)`;
    if (cardState) cardState.pinned ? placeCard(cardState.anchor) : hideCard();
  }
  function drawAxis() {
    const t1 = t0 + W / pxPerMs(), d0 = new Date(t0);
    let html = "", lines = "";
    const add = (t, label, cls = "") => {
      const px = x(t);
      if (px > 24 && px < W - 24) html += `<div class="tick ${cls}" style="left:${px}px">${label}</div>`;
      if (px > 0 && px < W) lines += `<div class="gl ${cls}" style="left:${px}px"></div>`;
    };
    for (let i = 0; ; i++) {
      const t = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + i, 1);
      if (t > t1) break;
      const dt = new Date(t), m = dt.getUTCMonth();
      add(t, m === 0 ? String(dt.getUTCFullYear()) : MON[m], m === 0 ? "year" : "");
    }
    axis.innerHTML = html;
    gridEl.innerHTML = lines;
  }

  board.addEventListener("click", ev => {
    if (ev.target.closest("[data-open-picker]")) return openPicker();
    const n = ev.target.closest("[data-info]");
    if (n) return showConfCard(n);
    const m = ev.target.closest("[data-ed]");
    if (m) showCard(m, true); else hideCard();
  });

  // ---------- detail card ----------
  const card = $("card");
  let cardState = null;
  function edFromKey(key) { const [id, i] = key.split("|"); return editions(byId.get(id))[+i]; }
  function showCard(el, pin) {
    if (cardState?.pinned && !pin) return;
    const e = edFromKey(el.dataset.ed), c = e.conf, now = Date.now();
    const it = el.dataset.item != null ? e.items[+el.dataset.item] : null;
    const rel = t => `<span class="${t > now && t - now < 14 * DAY ? "soon" : ""}">${relTime(t, now)}</span>`;
    let what, when, sub;
    switch (el.dataset.kind) {
      case "abstract":
        what = "Abstract deadline";
        when = fmtZone(it.abstract, e.off); sub = `${fmtLocal(it.abstract)} your time · ${rel(it.abstract)}`; break;
      case "paper":
        what = shortComment(it.comment) || "Full paper deadline";
        when = fmtZone(it.paper, e.off); sub = `${fmtLocal(it.paper)} your time · ${rel(it.paper)}`; break;
      case "rebuttal":
        what = "Rebuttal deadline";
        when = fmtZone(it.rebuttal, e.off); sub = `${fmtLocal(it.rebuttal)} your time · ${rel(it.rebuttal)}`; break;
      case "decision":
        what = "Decisions";
        when = fmtShort(it.decision, e.off); sub = rel(it.decision); break;
      default:
        what = "Conference";
        when = fmtRange(e.start, e.end);
        sub = [e.place && esc(e.place), rel(e.start)].filter(Boolean).join(" · ");
    }
    const site = siteFor(c, e);
    const isEst = el.dataset.kind === "conf" ? e.estConf : it?.est;
    card.innerHTML = `<button class="close" type="button" aria-label="Close">✕</button>
      <div class="ev-head">${esc(c.title)} ${e.year}${isEst ? ` <span class="badge est">estimated from ${e.basis}</span>` : ""}</div>
      <h2>${esc(what)}</h2>
      <div class="ev-when">${when}</div>
      <div class="ev-sub">${sub}</div>
      ${pin && site ? `<div class="actions">${goButton(site, e.link ? `${c.title} ${e.year} website` : `${c.title} website`)}</div>` : ""}`;
    card.classList.toggle("pinned", !!pin);
    card.hidden = false;
    cardState = { anchor: el, pinned: !!pin };
    placeCard(el);
  }
  // Website for an edition; estimated or unlinked editions fall back to the newest known site.
  function siteFor(c, e) {
    if (e?.link) return e.link;
    const known = editions(c).filter(x => x.link);
    return known.length ? known[known.length - 1].link : null;
  }
  const goButton = (href, label) => `<a class="go" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)} <span aria-hidden="true">↗</span></a>`;
  function showConfCard(el) {
    const c = byId.get(el.dataset.info), now = Date.now();
    const eds = editions(c);
    const nd = nextDeadline(c);
    const nextConf = eds.find(e => e.start != null && (e.end ?? e.start) + DAY >= now);
    const rows = [];
    if (nd) {
      const soon = nd.t - now < 14 * DAY ? "soon" : "";
      rows.push(`<dt>Next deadline</dt><dd>${fmtZone(nd.t, nd.e.off)}<span class="ev-sub"><span class="${soon}">${relTime(nd.t, now)}</span>${nd.est ? " · estimated" : ""}</span></dd>`);
    } else {
      rows.push(`<dt>Next deadline</dt><dd>Not announced</dd>`);
    }
    if (nextConf) {
      const live = now >= nextConf.start && now < (nextConf.end ?? nextConf.start) + DAY;
      rows.push(`<dt>${live ? "Happening now" : "Next meeting"}</dt><dd>${fmtRange(nextConf.start, nextConf.end)}<span class="ev-sub">${[nextConf.place && esc(nextConf.place), nextConf.estConf ? "estimated" : relTime(nextConf.start, now)].filter(Boolean).join(" · ")}</span></dd>`);
    }
    const site = siteFor(c, nd?.e ?? nextConf);
    const rank = c.rank.core ? ` <span class="badge">CORE ${esc(c.rank.core)}</span>` : "";
    const actions = [
      site && goButton(site, "Website"),
      c.dblp && `<a class="alt" href="https://dblp.org/db/conf/${esc(c.dblp)}/index.html" target="_blank" rel="noopener">Past papers on DBLP</a>`,
    ].filter(Boolean).join("");
    card.innerHTML = `<button class="close" type="button" aria-label="Close">✕</button>
      <h2>${esc(c.title)}${rank}</h2>
      <div class="full">${esc(c.description)}</div>
      <dl class="rows">${rows.join("")}</dl>
      ${actions ? `<div class="actions">${actions}</div>` : ""}`;
    card.classList.add("pinned");
    card.hidden = false;
    cardState = { anchor: el, pinned: true };
    placeCard(el);
  }
  function placeCard(el) {
    const r = el.getBoundingClientRect(), cr = card.getBoundingClientRect();
    if (el.hidden || r.right < 0 || r.left > window.innerWidth) { hideCard(); return; }
    const cx = el.classList.contains("lane-name") ? r.left + cr.width / 2 : r.left;
    const left = Math.max(12, Math.min(cx - cr.width / 2, window.innerWidth - cr.width - 12));
    let top = r.top + r.height / 2 + 18;
    if (top + cr.height > window.innerHeight - 12) top = r.top - cr.height - 18;
    card.style.left = `${left}px`; card.style.top = `${Math.max(12, top)}px`;
  }
  function hideCard() { card.hidden = true; cardState = null; }
  card.addEventListener("click", ev => { if (ev.target.closest(".close")) hideCard(); });
  inner.addEventListener("pointerover", ev => { const m = ev.target.closest("[data-ed]"); if (m) showCard(m, false); });
  inner.addEventListener("pointerout", ev => { if (ev.target.closest("[data-ed]") && cardState && !cardState.pinned) hideCard(); });
  lanesEl.addEventListener("scroll", () => { if (cardState) cardState.pinned ? placeCard(cardState.anchor) : hideCard(); }, { passive: true });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && cardState) hideCard(); });

  // ---------- picker ----------
  const picker = $("picker");
  function openPicker() {
    hideCard();
    $("q").value = "";
    openSel = new Set(selected);
    renderPicker();
    $("results").scrollTop = 0;
    if (picker.showModal) picker.showModal(); else picker.setAttribute("open", "");
  }
  function closePicker() {
    if (picker.close) picker.close(); else picker.removeAttribute("open");
  }
  picker.addEventListener("close", () => { save(); buildLanes(); });
  function setSelected(ids) { selected = [...new Set(ids)].filter(id => byId.has(id)); save(); renderPicker(); }
  let openSel = new Set();   // selection when the picker opened; those float to the top
  function renderPicker() { renderChips(); renderList(); }
  function renderChips() {
    $("tracks").innerHTML = TRACKS.map(t => {
      const n = t.ids.filter(id => selected.includes(id)).length, full = n === t.ids.length;
      return `<button type="button" class="chip${n && !full ? " partial" : ""}" aria-pressed="${full}" data-track="${t.id}">${esc(t.name)}</button>`;
    }).join("");
    $("done-btn").textContent = selected.length ? `Show ${selected.length} conference${selected.length === 1 ? "" : "s"}` : "Done";
  }
  function renderList() {
    const q = $("q").value.trim().toLowerCase();
    const list = D.conferences.filter(c => !q || c.title.toLowerCase().includes(q) || c.description.toLowerCase().includes(q) || c.id.includes(q))
      .sort((a, b) => (q ? 0 : (openSel.has(b.id) - openSel.has(a.id)))
        || (RANK_SCORE[a.rank.core] ?? 9) - (RANK_SCORE[b.rank.core] ?? 9) || a.title.localeCompare(b.title));
    const shown = list.slice(0, 150);
    $("results").innerHTML = shown.map(c => `<li><label><input type="checkbox" data-conf="${c.id}" ${selected.includes(c.id) ? "checked" : ""}>
        <strong>${esc(c.title)}</strong><span class="desc" title="${esc(c.description)}">${esc(c.description)}</span></label></li>`).join("")
      + (list.length > shown.length ? `<li class="none">Search to find the other ${list.length - shown.length}.</li>` : "")
      || `<li class="none">Nothing matches “${esc(q)}”.</li>`;
  }
  $("pick-btn").addEventListener("click", openPicker);
  $("done-btn").addEventListener("click", closePicker);
  picker.addEventListener("click", ev => {
    if (ev.target === picker) return closePicker();   // backdrop
    const t = ev.target.closest("[data-track]");
    if (!t) return;
    const tr = TRACKS.find(v => v.id === t.dataset.track);
    const full = tr.ids.every(id => selected.includes(id));
    setSelected(full ? selected.filter(id => !tr.ids.includes(id)) : [...selected, ...tr.ids]);
  });
  $("results").addEventListener("change", ev => {
    const i = ev.target.closest("[data-conf]"); if (!i) return;
    const id = i.dataset.conf;
    selected = i.checked ? [...new Set([...selected, id])] : selected.filter(v => v !== id);
    save();
    renderChips();
  });
  $("q").addEventListener("input", renderList);

  // ---------- init ----------
  measure();
  buildLanes();
  setInterval(layout, 60000);
  new ResizeObserver(layout).observe(board);
  if (firstVisit) openPicker();
})();
</script>
</body>
</html>
